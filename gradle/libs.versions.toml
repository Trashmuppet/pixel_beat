[versions]
# Build tooling
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# Kotlinx
coroutines = "1.9.0"
serialization = "1.7.3"

# Compose / AndroidX
composeBom = "2024.11.00"
material3 = "1.3.1"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
coreKtx = "1.15.0"

# Monetisation
playBilling = "7.1.1"

# Room (rebuildable recent-projects cache per docs/14_STORAGE.md)
#
# Room 2.7+ adds first-class KSP2 support, which is the default KSP
# implementation under Kotlin 2.0.21. Room 2.6.x is KSP1-only and
# fails annotation processing on `@Database` with `[MissingType]:
# Element StorageDatabase references a type that is not present`.
room = "2.7.2"

# SQLite framework. Required by `MigrationTestHelper` /
# `FrameworkSQLiteOpenHelperFactory` in
# `storage/src/test/.../StorageDatabaseMigrationTest.kt`. Pinned to
# the Room 2.7.x release line.
sqlite = "2.4.0"

# Test scaffolding (Phase 6 close-out: MigrationTestHelper on Robolectric)
robolectric = "4.13"
androidxTestExtJunit = "1.2.1"
androidxTestCore = "1.6.1"

[libraries]
# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose (versions managed by BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Google Play Billing
play-billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "playBilling" }

# Room (storage cache layer)
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# SQLite framework — `androidx.sqlite.db.framework.FrameworkSQLiteOpenHelperFactory`
# for `MigrationTestHelper` in Robolectric test.
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }

# Test scaffolding — Robolectric + AndroidJUnit4 for Room MigrationTestHelper
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
