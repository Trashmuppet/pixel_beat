# Gradle build properties
#
# Force the legacy KSP1 processor path. Room 2.6.1 (the version pinned in
# gradle/libs.versions.toml) is KSP1-only: under Kotlin 2.0.21 KSP defaults
# to KSP2 and Room's annotation processor can't resolve the `@Database`
# element signature, surfacing as `[MissingType]: Element StorageDatabase
# references a type that is not present`. Room 2.7+ adds proper KSP2
# support; until that bump lands, force KSP1.
#
# Explicit AndroidX opt-in. AGP 8.7.x's runtime-classpath guard
# requires this property when AndroidX deps are present, even though
# the value is the historical default — set it explicitly so the
# `:storage:debugRuntimeClasspath` check passes after the KSP1 toggle.
#
# Verified: ./gradlew :storage:compileDebugKotlin --no-daemon
ksp.useKSP2=false
android.useAndroidX=true