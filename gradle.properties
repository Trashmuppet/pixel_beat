# Gradle build properties
#
# Explicit AndroidX opt-in. AGP 8.7.x's runtime-classpath guard
# requires this property when AndroidX deps are present, even though
# the value is the historical default.
#
# Note: KSP2 (the default under Kotlin 2.0.21) is now supported by
# Room 2.7.2 — the `ksp.useKSP2=false` toggle from the prior
# investigation round is no longer required.
android.useAndroidX=true